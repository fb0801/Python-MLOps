services:

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenml
      POSTGRES_PASSWORD: zenml
      POSTGRES_DB: zenml
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenml"]
      interval: 10s
      timeout: 5s
      retries: 5



  zenml-server:
    image: zenmldocker/zenml-server:0.58.2
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8237:8237"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZENML_DATABASE_URL: postgresql://zenml:zenml@postgres:5432/zenml
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8237/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


    

  jupyter:
    build: .
    container_name: zenml-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    depends_on:
      zenml-server:
        condition: service_healthy
    command: >
      start-notebook.sh
      --NotebookApp.token=''
      --NotebookApp.password=''
    environment:
      ZENML_STORE_URL: http://zenml-server:8237

volumes:
  postgres_data:
